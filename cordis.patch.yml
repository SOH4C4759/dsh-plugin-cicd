# dsh-plugin-cicd bundle patch.
#
# One Host row named after the package. The Host half owns the loopback route
# family `/api/dsh-cicd/*` and shells out to the machine's authenticated `gh`;
# the browser half is declared by `dsh.client` in package.json and registers the
# sidebar entry plus the `main` panel.
#
# The repository list is deliberately EMPTY here. Which repositories a machine
# watches is deployment state, not package state: shipping a list would publish
# one user's private repository names inside a public package, and every install
# would then need to unpick it.
#
# Do not hand-write the list either. `scripts/configure.mjs` owns a JSON file and
# the panel re-reads it on every request, so a change applies without a restart:
#
#   node scripts/configure.mjs add <repo> --path <absolute dir>
#
# This row therefore carries only the machine-specific bits:
#
#   - id: dsh-plugin-cicd
#     config:
#       ghPath: 'C:\Program Files\GitHub CLI\gh.exe'
#       owner: your-login
#
# Full option list (each has a default, so only write what you change):
#   owner             default ''      GitHub login for bare `repo` entries
#   repos             default []      hand-written fallback; the managed file wins
#   configFile        default ''      '' = <DSH_HOME>/dsh-plugin-cicd/repos.json
#   projectsRoot      default ''      where local checkouts live; the panel adds a
#                                     repository by matching its package.json name there
#   defaultBranch     default main    ref used when the panel triggers a workflow
#   buildWorkflow     default ci.yml  the workflow the 构建 button dispatches
#   releaseWorkflow   default release.yml
#   ghPath            default ''      empty = resolve from PATH and common installs
#   requestTimeoutMs  default 20000   per `gh` invocation
#   overviewTtlMs     default 15000   cache window; the panel polls through it
#   logTailLines      default 120     how much of `--log-failed` the panel shows
#   pollSeconds       default 30      how often the panel refreshes itself
#   bilibiliEnabled   default true    the whole Bilibili update-note feature
#   bilibiliAuto      default true    post automatically when a release goes public;
#                                     false leaves only the panel's button
#   bilibiliWatchSeconds
#                     default 90      how often the Host looks for a newly published
#                                     release; 0 stops the clock (the sweep after
#                                     publishing a draft still runs)
#   bilibiliTemplate  default ''      '' = 【更新 {tag}】{summary}. Placeholders:
#                                     {tag} {version} {label} {repo} {title}
#                                     {summary} {url} {date}
#   bilibiliCookieFile
#                     default ''      '' = the plugin's own file, which the panel's
#                                     sign-in writes. Point it at biliup's
#                                     cookies.json to read that instead — but note
#                                     that biliup logs in as BiliTV, and a comment is
#                                     a WEB API, so a TV credential answers -101.
#   bilibiliVerifyTtlMs
#                     default 300000  how long a credential/video answer is reused
#   enabled           default true
- insert:
    - id: dsh-plugin-cicd
      name: 'dsh-plugin-cicd'
      config:
        owner: ''
        repos: []
